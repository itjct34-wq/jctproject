<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img">
  <title>Hinomoto</title>
  <!-- Simplified rising-sun mark: Hinomoto = “origin of the sun” -->
  <g fill="#E60012">
    <circle cx="24" cy="24" r="11"/>
    <g transform="translate(24 24)">
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(45)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(90)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(135)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(180)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(225)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(270)"/>
      <rect x="-1.6" y="-22" width="3.2" height="8" rx="1" transform="rotate(315)"/>
    </g>
  </g>
</svg>
