name: Android ERP APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'native-www/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Install JS deps
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/erp.apk
          ls -lh public/downloads/erp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: erp-android-apk
          path: public/downloads/erp.apk
          if-no-files-found: error

      - name: Replace previous erp-apk-latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete erp-apk-latest --yes --cleanup-tag || true

      - name: Publish GitHub Release (sideload APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: erp-apk-latest
          name: ERP Android APK
          body: |
            Debug sideload APK for the ERP shell (`com.jct.erp`).
            Opens `https://jctproject.vercel.app/login` only — marketing routes blocked.
            Set NEXT_PUBLIC_ANDROID_APK_URL to this asset URL to enable /download.
          files: public/downloads/erp.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
